# Production buildspec for the iOS repo under test.
# Runs on the MAC_ARM CodeBuild fleet. The MCP ios_test tool overrides
# SCHEME / DEVICE / OS_VERSION / TEST_PLAN / PROJECT_DIR via
# environmentVariablesOverride; ARTIFACTS_BUCKET is set on the project.
#
# This file is the STUB + environment only. The build body (~31 KB of shell)
# lives in tooling/ios-build.sh and is fetched from S3 at build time, because
# CodeBuild caps an INLINE buildspec at 25600 bytes - a cap we hit for real on
# the live project (a4bc8ef "25550B < 25600B cap"). The stack asserts the cap at
# synth time. Both files ship in the same `cdk deploy`: this one is embedded
# inline into the project, tooling/ios-build.sh is uploaded to
# s3://<bucket>/tooling/ by the ToolingDeployment BucketDeployment.
#
# Each CodeBuild command runs in its own shell with a fresh CWD, so the body is
# ONE script (state: cd, vars) invoked from ONE command here.
version: 0.2

env:
  variables:
    SCHEME: ""          # required (or auto-detected to the first shared scheme)
    DEVICE: "iPhone 17" # simulator device name
    OS_VERSION: "latest"
    TEST_PLAN: ""
    PROJECT_DIR: "."    # subdir holding the .xcworkspace/.xcodeproj (e.g. "ios")
    PLATFORM: "auto"    # auto|ios|macos — auto picks iOS Simulator if the scheme has
                        # one, else native macOS (SwiftUI/AppKit Mac apps). ios_test override.
    CLEAN_BUILD: ""     # "true" (per-call ios_test arg) forces a cold build; warm state untouched
    RECORD_SESSION: ""  # "true" (per-call ios_test arg) records the whole simulator display to session.mp4
    COMPUTE_SIZE: "medium"  # fleet size this run lands on; scopes the S3 warm cache key so
                            # medium and large (separate fleets, separate Macs) never restore
                            # each other's DerivedData (cross-size restore fails Swift validity
                            # -> full recompile + mutual clobber). Set by ios_test per call.

phases:
  build:
    commands:
      - |
        # Fetch and run the build body. Edit tooling/ios-build.sh + `cdk deploy`
        # to change build behavior (the same deploy updates this stub and the
        # script, so they cannot skew). The build role can already read the
        # bucket - the body fetches tooling/xcresult_to_junit.py the same way.
        SCRIPT="/tmp/ios-build-${CODEBUILD_BUILD_NUMBER:-0}.sh"
        if ! aws s3 cp "s3://$ARTIFACTS_BUCKET/tooling/ios-build.sh" "$SCRIPT"; then
          echo "ERROR: could not fetch s3://$ARTIFACTS_BUCKET/tooling/ios-build.sh"
          echo "       likely causes: runner disk full, or tooling not deployed (cdk deploy)"
          df -Pk "$HOME" 2>/dev/null || df -Pk / 2>/dev/null || true
          echo "       see docs/RUNBOOK-runner-disk-full.md"
          exit 1
        fi
        bash "$SCRIPT"
        exit $?

reports:
  ios-test-report:
    files:
      - "test_results.xml"
    file-format: "JUNITXML"

artifacts:
  files:
    - "build_output.log"
    - "screenshot_final.png"
  base-directory: "."

# No CodeBuild `cache:` block: warm state is managed by hand in tooling/ios-build.sh
# (per-repo+size DerivedData + SPM + stable src under $HOME/ios-mcp-state,
# round-tripped to S3 warm-cache/<key>.tar.gz). LOCAL_CUSTOM_CACHE symlinks
# through a root-owned store the build user can't write (POSIX 13); native S3
# cache can't preserve the absolute-path-stable layout Swift incremental needs.
